<style>
    body {
        background: #f7f7f5;
        color: #222220;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 650px;
        margin: 0 auto;
        padding: 40px 20px;
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        min-height: 85vh;
    }

    @media (max-width: 600px) {
        body {
            padding: 20px 15px;
        }
    }

    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .header-container {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    /* Integrated Blink and Glitch Keyframes */
    @keyframes glitch-blink {
        0%, 78%, 100% { 
            transform: scaleY(1) translate(0);
            opacity: 1;
            filter: none;
            clip-path: inset(0 0 0 0);
        }
        79% { /* Brief pre-blink glitch distortions */
            transform: scaleY(1) translate(3px, -2px);
            opacity: 0.9;
            filter: hue-rotate(90deg) saturate(2);
            clip-path: inset(10% 0 70% 0);
        }
        80% { 
            transform: scaleY(1) translate(-3px, 2px);
            opacity: 0.7;
            filter: hue-rotate(-90deg) saturate(2);
            clip-path: inset(70% 0 10% 0);
        }
        81% {
            transform: scaleY(1) translate(1px, 1px);
            filter: none;
            clip-path: inset(0 0 0 0);
        }
        90% { /* The actual blink (shut eyes) */
            transform: scaleY(0.05) translate(0);
            opacity: 1;
            filter: none;
            clip-path: inset(0 0 0 0);
        }
    }

    .blink-logo {
        width: 40px;
        height: 40px;
        min-width: 40px;
        object-fit: cover;
        border-radius: 50%;
        /* Apply the combined animation */
        animation: glitch-blink 6s infinite;
        transform-origin: center;
        position: relative; /* Required for pseudo-elements */
        background: inherit; /* Ensures pseudo-elements match image source */
    }

    /* Pseudo-elements for enhanced glitch effect layers */
    .blink-logo::before,
    .blink-logo::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: inherit;
        background-size: cover;
        border-radius: 50%;
        opacity: 0.5;
        visibility: hidden; /* Hidden by default, only active during main glitch moments */
    }

    /* We can tie pseudo-element visibility to the animation steps */
    .blink-logo:hover::before,
    .blink-logo:hover::after {
        visibility: visible;
    }
    /* Alternatively, use CSS variables or complex keyframes to toggle visibility,
       but for this minimal light-theme request, distorting the main image is sufficient. */

    .site-title {
        font-weight: 600;
        letter-spacing: -0.5px;
        word-break: break-all;
    }

    .content {
        flex: 1;
    }

    .entry { margin-top: 30px; }
    .date { color: #777; font-size: 0.85em; margin-bottom: 5px; }

    footer {
        margin-top: 50px;
        font-size: 0.85em;
        color: #777;
        border-top: 1px solid #e0e0dc;
        padding-top: 20px;
    }
</style>
