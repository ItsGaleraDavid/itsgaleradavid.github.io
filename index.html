<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ItsGaleraDavid</title>
<link rel="icon" href="profile.ico" type="image/x-icon">
<style>
    body {
        background: #f7f7f5;
        color: #222220;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 650px;
        margin: 0 auto;
        padding: 40px 20px;
        line-height: 1.6;
        display: flex;
        flex-direction: column;
        min-height: 85vh;
    }

    @media (max-width: 600px) {
        body {
            padding: 20px 15px;
        }
    }

    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .header-container {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    @keyframes blink {
        0%, 90%, 100% {
            transform: scaleY(1);
        }
        95% {
            transform: scaleY(0.05);
        }
    }

    .blink-logo {
        width: 40px;
        height: 40px;
        min-width: 40px;
        object-fit: cover;
        border-radius: 50%;
        animation: blink 4s infinite;
        transform-origin: center;
    }

    .site-title {
        font-weight: 600;
        letter-spacing: -0.5px;
        word-break: break-all;
    }

    .content {
        flex: 1;
    }

    .entry { margin-top: 30px; }
    .date { color: #777; font-size: 0.85em; margin-bottom: 5px; }

    footer {
        margin-top: 50px;
        font-size: 0.85em;
        color: #777;
        border-top: 1px solid #e0e0dc;
        padding-top: 20px;
    }
</style>
</head>
<body>

<div class="content">
    <div class="header-container">
        <img src="profile.png" alt="logo" class="blink-logo">
        <span class="site-title">Personal space.</span>
    </div>

    <hr style="border: 0; border-top: 1px solid #e0e0dc; margin: 25px 0;">

    <div class="entry">
        <div class="date">2026-08-27</div>
        <p>A personal digital space where I share projects, learnings, experiments, and ideas about programming, cybersecurity, 3D, and virtual worlds. A place to build, explore, and document discoveries.</p>
    </div>
</div>

<footer>
    © 2026 ItsGaleraDavid. All rights reserved.
</footer>

</body>
</html>
