<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>itsgaleradavid</title>
<link rel="icon" href="profile.ico" type="image/x-icon">
<style>
    body {
        background: #f7f7f5;
        color: #222220;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 650px;
        margin: 60px auto;
        padding: 0 20px;
        line-height: 1.6;
    }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    .header-container {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    @keyframes blink {
        0%, 90%, 100% {
            transform: scaleY(1);
        }
        95% {
            transform: scaleY(0.05);
        }
    }

    .blink-logo {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 50%;
        animation: blink 4s infinite;
        transform-origin: center;
    }

    .site-title {
        font-weight: 600;
        letter-spacing: -0.5px;
    }

    .entry { margin-top: 30px; }
    .date { color: #777; font-size: 0.85em; margin-bottom: 5px; }
</style>
</head>
<body>

<div class="header-container">
    <img src="profile.png" alt="logo" class="blink-logo">
    <span class="site-title">itsgaleradavid.github.io</span>
</div>

<hr style="border: 0; border-top: 1px solid #e0e0dc; margin: 25px 0;">

<div class="entry">
    <div class="date">2026-08-27</div>
    <p>Esqueleto base. Aquí irán las cosas.</p>
</div>

</body>
</html>
