<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>itsgaleradavid</title>
<link rel="icon" href="perfil.ico" type="image/x-icon">
<style>
    body {
        background: #000;
        color: #00ff00;
        font-family: monospace;
        max-width: 650px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.5;
    }
    a { color: #fff; }
    a:hover { background: #00ff00; color: #000; text-decoration: none; }
    
    .header-container {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    @keyframes blink {
        0%, 90%, 100% {
            transform: scaleY(1);
        }
        95% {
            transform: scaleY(0.05); /* Simula el parpadeo cerrándose */
        }
    }

    .blink-logo {
        width: 45px;
        height: 45px;
        object-fit: cover;
        border: 1px solid #00ff00;
        animation: blink 4s infinite;
        transform-origin: center;
    }

    .entry { margin-bottom: 25px; }
    .date { color: #666; font-size: 0.9em; }
</style>
</head>
<body>

<div class="header-container">
    <img src="perfil.png" alt="logo" class="blink-logo">
    <span>itsgaleradavid.github.io</span>
</div>

<hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

<div class="entry">
    <div class="date">2026-08</div>
    <p>Esqueleto base. Aquí irán las cosas.</p>
</div>

</body>
</html>
